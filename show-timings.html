<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BookMyShow Clone &mdash; Show Timings</title>
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/movies.css" />
</head>
<body>
  <!-- Shared navbar injected here by js/common.js -->
  <div id="navbar"></div>

  <main class="container timings-page">
    <div class="timings-header">
      <h1 id="movieTitle">Loading…</h1>
      <p class="details-meta-line-dark" id="movieMetaLine"></p>
    </div>

    <!-- Date selector -->
    <div class="date-selector" id="dateSelector"></div>

    <!-- Theatre list -->
    <section class="theatre-list" id="theatreList"></section>
  </main>

  <!-- Shared footer injected here by js/common.js -->
  <div id="footer"></div>

  <script src="js/common.js"></script>
  <script src="js/api.js"></script>
  <script src="js/movies.js"></script>
</body>
</html>
