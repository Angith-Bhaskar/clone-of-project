<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BookMyShow Clone &mdash; Booking Summary</title>
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/booking.css" />
</head>
<body>
  <!-- Shared navbar injected here by js/common.js -->
  <div id="navbar"></div>

  <main class="container summary-page">
    <h1 class="summary-title">Booking Summary</h1>

    <div class="summary-layout">
      <!-- Show details -->
      <section class="summary-card show-card">
        <img class="summary-poster" src="https://images.unsplash.com/photo-1517602302552-471fe67acf66?w=300&q=80" alt="The Last Signal poster" />
        <div class="show-card-info">
          <h2>The Last Signal</h2>
          <p class="details-meta-line-dark">English, Hindi &bull; IMAX &bull; UA</p>
          <p class="show-card-venue">PVR Cinemas: Phoenix Mall</p>
          <p class="details-meta-line-dark" id="showDateTime">Today, 8:30 PM</p>
        </div>
      </section>

      <!-- Selected seats, removable -->
      <section class="summary-card">
        <h3>Your Seats</h3>
        <div class="seat-chip-row" id="seatChipRow"></div>
      </section>

      <!-- Price breakdown -->
      <section class="summary-card">
        <h3>Price Breakdown</h3>
        <div class="price-row">
          <span id="ticketCountLabel">0 Tickets</span>
          <span id="subtotalLabel">₹0</span>
        </div>
        <div class="price-row">
          <span>Convenience Fee</span>
          <span id="convenienceFeeLabel">₹0</span>
        </div>
        <div class="price-row">
          <span>GST (18%)</span>
          <span id="gstLabel">₹0</span>
        </div>
        <div class="price-row price-row-total">
          <span>Grand Total</span>
          <span id="grandTotalLabel">₹0</span>
        </div>
      </section>
    </div>
  </main>

  <!-- Sticky proceed bar -->
  <div class="booking-bar">
    <div class="booking-bar-info">
      <span id="barTicketCountLabel">0 Tickets</span>
      <strong id="barTotalLabel">₹0</strong>
    </div>
    <button type="button" class="btn btn-primary" id="proceedToPaymentBtn" disabled>Proceed to Pay</button>
  </div>

  <!-- Shared footer injected here by js/common.js -->
  <div id="footer"></div>

  <script src="js/common.js"></script>
  <script src="js/booking.js"></script>
</body>
</html>
