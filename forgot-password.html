<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BookMyShow Clone &mdash; Forgot Password</title>
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>
  <!-- Shared navbar injected here by js/common.js -->
  <div id="navbar"></div>

  <main class="auth-page">
    <div class="auth-card">
      <h1 class="auth-title">Forgot Password?</h1>
      <p class="auth-subtitle">Enter the email linked to your account and we'll send a reset link.</p>

      <form class="auth-form" id="forgotPasswordForm" novalidate>
        <label class="field-label" for="forgotEmailInput">Email Address</label>
        <input type="email" id="forgotEmailInput" placeholder="you@example.com" />
        <p class="field-error" id="forgotEmailError"></p>

        <button type="submit" class="btn btn-primary btn-block">Send Reset Link</button>
      </form>

      <!-- Shown after a successful (dummy) submit -->
      <p class="auth-success" id="forgotSuccessMessage" hidden>
        If an account exists for that email, a password reset link has been sent.
      </p>

      <p class="auth-footer-text">
        Remembered your password? <a href="login.html" class="auth-link">Sign In</a>
      </p>
    </div>
  </main>

  <!-- Shared footer injected here by js/common.js -->
  <div id="footer"></div>

  <script src="js/common.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
