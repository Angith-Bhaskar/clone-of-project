<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BookMyShow Clone &mdash; Sign In</title>
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>
  <!-- Shared navbar injected here by js/common.js -->
  <div id="navbar"></div>

  <main class="auth-page">
    <div class="auth-card">
      <h1 class="auth-title">Sign In</h1>
      <p class="auth-subtitle">Book tickets for movies, events, plays and more.</p>

      <!-- Google sign-in (UI only, no real OAuth) -->
      <button type="button" class="btn btn-outline btn-block google-btn" id="googleLoginBtn">
        <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="" width="18" height="18" />
        Continue with Google
      </button>

      <div class="auth-divider"><span>or</span></div>

      <!-- Tabs to switch between phone / email login -->
      <div class="auth-tabs" role="tablist">
        <button type="button" class="auth-tab active" id="phoneTabBtn" role="tab" aria-selected="true">Phone</button>
        <button type="button" class="auth-tab" id="emailTabBtn" role="tab" aria-selected="false">Email</button>
      </div>

      <!-- Phone login form -->
      <form class="auth-form" id="phoneLoginForm" novalidate>
        <label class="field-label" for="phoneInput">Phone Number</label>
        <div class="phone-input-group">
          <span class="phone-prefix">+91</span>
          <input type="tel" id="phoneInput" placeholder="Enter 10-digit mobile number" maxlength="10" inputmode="numeric" />
        </div>
        <p class="field-error" id="phoneError"></p>

        <button type="submit" class="btn btn-primary btn-block">Continue</button>
      </form>

      <!-- Email login form (hidden until Email tab is selected) -->
      <form class="auth-form" id="emailLoginForm" novalidate hidden>
        <label class="field-label" for="emailInput">Email Address</label>
        <input type="email" id="emailInput" placeholder="you@example.com" />
        <p class="field-error" id="emailError"></p>

        <label class="field-label" for="passwordInput">Password</label>
        <div class="password-input-group">
          <input type="password" id="passwordInput" placeholder="Enter your password" />
          <button type="button" class="toggle-password" id="togglePassword" aria-label="Show password">&#128065;</button>
        </div>
        <p class="field-error" id="passwordError"></p>

        <a href="forgot-password.html" class="auth-link forgot-link">Forgot Password?</a>

        <button type="submit" class="btn btn-primary btn-block">Continue</button>
      </form>

      <p class="auth-footer-text">
        New to BookMyShow? <a href="signup.html" class="auth-link">Sign Up</a>
      </p>
    </div>
  </main>

  <!-- Shared footer injected here by js/common.js -->
  <div id="footer"></div>

  <script src="js/common.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
